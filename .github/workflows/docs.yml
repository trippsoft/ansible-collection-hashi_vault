---
name: Generate Role Docs
'on':
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/install/.aar_doc.yml
      - roles/install/README.md
      - roles/install/meta/argument_specs.yml
      - roles/install/meta/main.yml
      - roles/signed_certificate/.aar_doc.yml
      - roles/signed_certificate/README.md
      - roles/signed_certificate/meta/argument_specs.yml
      - roles/signed_certificate/meta/main.yml
      - roles/testing/.aar_doc.yml
      - roles/testing/README.md
      - roles/testing/meta/argument_specs.yml
      - roles/testing/meta/main.yml
      - roles/testing_ca/.aar_doc.yml
      - roles/testing_ca/README.md
      - roles/testing_ca/meta/argument_specs.yml
      - roles/testing_ca/meta/main.yml
defaults:
  run:
    working-directory: 'trippsc2.hashi_vault'
jobs:
  docs_install:
    name: Generate install role documentation
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.hashi_vault
          ref: main
      - name: Generate install role documentation
        working-directory: 'trippsc2.hashi_vault'
        run: |
          source ~/venv/ansible-2.16/bin/activate
          cd ./roles/install
          aar-doc . markdown
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md || /bin/true
          git commit -m "Update install role documentation." || /bin/true
          git push origin main
          deactivate
  docs_signed_certificate:
    name: Generate signed_certificate role documentation
    needs: docs_install
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.hashi_vault
          ref: main
      - name: Generate signed_certificate role documentation
        working-directory: 'trippsc2.hashi_vault'
        run: |
          source ~/venv/ansible-2.16/bin/activate
          cd ./roles/signed_certificate
          aar-doc . markdown
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md || /bin/true
          git commit -m "Update signed_certificate role documentation." || /bin/true
          git push origin main
          deactivate
  docs_testing:
    name: Generate testing role documentation
    needs: docs_signed_certificate
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.hashi_vault
          ref: main
      - name: Generate testing role documentation
        working-directory: 'trippsc2.hashi_vault'
        run: |
          source ~/venv/ansible-2.16/bin/activate
          cd ./roles/testing
          aar-doc . markdown
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md || /bin/true
          git commit -m "Update testing role documentation." || /bin/true
          git push origin main
          deactivate
  docs_testing_ca:
    name: Generate testing_ca role documentation
    needs: docs_testing
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.hashi_vault
          ref: main
      - name: Generate testing_ca role documentation
        working-directory: 'trippsc2.hashi_vault'
        run: |
          source ~/venv/ansible-2.16/bin/activate
          cd ./roles/testing_ca
          aar-doc . markdown
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md || /bin/true
          git commit -m "Update testing_ca role documentation." || /bin/true
          git push origin main
          deactivate
